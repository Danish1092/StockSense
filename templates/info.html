{% extends "base.html" %}
{% block title %}Company Info - StockSense{% endblock %}
{% block content %}
<div class="min-h-screen bg-black py-8 px-2">
    <h1 class="text-4xl font-extrabold text-green-400 mb-8 text-center tracking-wide drop-shadow-lg">{{ clean_company_name }}</h1>
    <div class="flex flex-col md:flex-row gap-8 w-full max-w-[1600px] mx-auto" x-data="{ tab: '' }">
        <!-- Chart Section -->
        <div :class="tab ? 'flex-1' : 'w-full'" class="transition-all duration-500 flex flex-col items-center">
            <div :class="tab ? 'max-w-2xl' : 'max-w-5xl'" class="bg-black/70 backdrop-blur-md rounded-2xl p-8 w-full h-96 flex flex-col items-center justify-center shadow-2xl border-2 border-green-700/40 transition-all duration-500 relative">
                <div class="w-full flex justify-center mb-2">
                    <div id="periodButtons" class="flex gap-2">
                        <button class="period-btn px-3 py-1 rounded text-green-200 border border-green-700 bg-black hover:bg-green-900 transition text-sm font-semibold" data-period="5d">5D</button>
                        <button class="period-btn px-3 py-1 rounded text-green-200 border border-green-700 bg-black hover:bg-green-900 transition text-sm font-semibold" data-period="1mo">1M</button>
                        <button class="period-btn px-3 py-1 rounded text-green-200 border border-green-700 bg-black hover:bg-green-900 transition text-sm font-semibold" data-period="6mo">6M</button>
                        <button class="period-btn px-3 py-1 rounded text-green-200 border border-green-700 bg-black hover:bg-green-900 transition text-sm font-semibold" data-period="ytd">YTD</button>
                        <button class="period-btn px-3 py-1 rounded text-green-200 border border-green-700 bg-black hover:bg-green-900 transition text-sm font-semibold" data-period="1y">1Y</button>
                        <button class="period-btn px-3 py-1 rounded text-green-200 border border-green-700 bg-black hover:bg-green-900 transition text-sm font-semibold" data-period="5y">5Y</button>
                        <button class="period-btn px-3 py-1 rounded text-green-200 border border-green-700 bg-black hover:bg-green-900 transition text-sm font-semibold" data-period="max">Max</button>
                    </div>
                </div>
                <div id="chartLoading" class="absolute inset-0 flex items-center justify-center z-10">
                    <svg class="animate-spin h-12 w-12 text-green-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                    </svg>
                </div>
                <canvas id="stockChart" class="w-full h-full"></canvas>
                <div id="chartError" class="hidden absolute inset-0 flex items-center justify-center z-20">
                    <span class="text-red-400 text-xl font-semibold">No data available for this stock.</span>
                </div>
            </div>
                <div class="flex flex-row gap-8 mt-8 w-full justify-center">
                {% if can_predict %}
                <button id="predictBtn" @click="tab = 'predict'" class="w-56 px-6 py-3 border-2 border-green-500 bg-black italic font-semibold text-lg rounded-lg text-green-400 hover:bg-green-900 hover:text-green-200 transition focus:outline-none shadow">predict</button>
                {% endif %}
                <button id="newsBtn" @click="tab = 'news'" class="w-56 px-6 py-3 border-2 border-green-500 bg-black italic font-semibold text-lg rounded-lg text-green-400 hover:bg-green-900 hover:text-green-200 transition focus:outline-none shadow">news</button>
                <button id="chatbotBtn" @click="tab = 'chatbot'" class="w-56 px-6 py-3 border-2 border-green-500 bg-black italic font-semibold text-lg rounded-lg text-green-400 hover:bg-green-900 hover:text-green-200 transition focus:outline-none shadow">chatbot</button>
            </div>
        </div>
        <!-- Dynamic Section -->
        <template x-if="tab">
            <div class="flex-1 min-w-[320px] max-w-lg transition-all duration-500 flex items-center">
                <div class="w-full relative">
                    <button @click="tab = ''" class="absolute top-4 right-4 px-3 py-1 bg-green-900 text-green-200 border border-green-600 rounded hover:bg-green-700 transition text-sm font-semibold">Hide ✕</button>
                    <template x-if="tab === 'predict'">
                        <div class="bg-black rounded-2xl p-8 shadow-2xl border border-green-700 w-full">
                            <h2 class="text-2xl font-bold mb-2 text-green-400">Predict Price</h2>
                            <p class="text-green-200 mb-4">Prediction results for <strong>{{ clean_company_name }}</strong></p>
                            <div id="predictPanel">
                                <div id="predictLoading" class="hidden w-full flex items-center justify-center mb-4">
                                    <svg class="animate-spin h-10 w-10 text-green-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                                    </svg>
                                </div>
                                <div id="predictResults" class="hidden">
                                    <div class="text-green-200 mb-2">Last close: <span id="lastClose" class="font-semibold"></span> (as of <span id="lastDate"></span>)</div>
                                    <div class="text-green-200 mb-2">Predicted:</div>
                                    <ul id="predList" class="list-disc list-inside text-green-200"></ul>
                                </div>
                                <div id="predictError" class="hidden text-red-400 font-semibold">Prediction failed. Try again later.</div>
                            </div>
                        </div>
                    </template>
                    <template x-if="tab === 'news'">
                        <div class="bg-black rounded-2xl p-8 shadow-2xl border border-green-700 w-full">
                            <h2 class="text-2xl font-bold mb-2 text-green-400">Market News</h2>
                            <p class="text-green-200 mb-4">Latest news for <strong>{{ clean_company_name }}</strong> will appear here.</p>
                            <div id="newsLoading" class="hidden w-full flex items-center justify-center mb-4">
                                <svg class="animate-spin h-8 w-8 text-green-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                                </svg>
                            </div>
                            <ul id="newsList" class="list-disc pl-6 space-y-3 text-green-300">
                                <!-- populated by JS -->
                            </ul>
                        </div>
                    </template>
                    <template x-if="tab === 'chatbot'">
                        <div class="bg-black/80 rounded-2xl shadow-2xl border border-green-800/40 w-full flex flex-col h-[70vh] md:h-[70vh] overflow-hidden min-h-0">
                            <!-- ChatGPT-style Header -->
                            <div class="bg-gradient-to-r from-black via-gray-900 to-black border-b border-green-800/30 px-6 py-4">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-green-400 to-green-600 flex items-center justify-center">
                                            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
                                            </svg>
                                        </div>
                                        <div>
                                            <h3 class="text-lg font-bold text-green-200">{{ clean_company_name }} Analyst</h3>
                                            <p class="text-xs text-green-200/70">Powered by OpenAI</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Chat Messages Area (ChatGPT-like) -->
                            <div id="chatWindow" class="flex-1 overflow-y-auto bg-transparent px-6 py-4 space-y-4 min-h-0">
                                <!-- Welcome message -->
                                <div class="flex justify-center mb-6">
                                    <div class="text-center text-green-200/80 text-sm">
                                        <p class="font-semibold text-green-200 mb-2">Ask me anything about {{ clean_company_name }}</p>
                                        <p class="text-xs text-green-200/60">Financial insights • Market analysis • Company info</p>
                                    </div>
                                </div>
                                <!-- messages will be appended here -->
                            </div>

                            <!-- Input Area (ChatGPT-style) -->
                            <div class="bg-transparent border-t border-green-800/30 px-6 py-4">
                                <div class="flex gap-3 items-end">
                                    <div class="flex-1 relative">
                                        <input id="chatInput" type="text" placeholder="Message about {{ clean_company_name }}..." 
                                            class="w-full px-4 py-3 bg-transparent border border-green-700/40 rounded-xl text-green-100 placeholder-green-300 focus:border-green-500 focus:ring-1 focus:ring-green-500 focus:outline-none transition-all duration-200 resize-none" 
                                            rows="1" />
                                    </div>
                                    <button id="sendChatBtn" class="p-3 bg-green-600 hover:bg-green-700 rounded-xl text-white transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-md flex items-center justify-center">
                                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16151495 C3.34915502,0.9 2.40734225,0.9 1.77946707,1.4429026 C0.994623095,2.0761224 0.837654326,3.16346049 1.15159189,3.94894737 L3.03521743,10.3899404 C3.03521743,10.5470277 3.19218622,10.7041251 3.50612381,10.7041251 L16.6915026,11.4896119 C16.6915026,11.4896119 17.1624089,11.4896119 17.1624089,12.0327095 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z"/>
                                        </svg>
                                    </button>
                                </div>
                                <div id="chatStatus" class="text-xs text-green-200/70 font-medium mt-2 h-5 flex items-center">
                                    <!-- Status messages appear here -->
                                </div>
                            </div>
                        </div>
                        <style>
                            #chatWindow::-webkit-scrollbar {
                                width: 8px;
                            }
                            #chatWindow::-webkit-scrollbar-track {
                                background: transparent;
                            }
                            #chatWindow::-webkit-scrollbar-thumb {
                                background: rgb(209, 213, 219);
                                border-radius: 4px;
                            }
                            #chatWindow::-webkit-scrollbar-thumb:hover {
                                background: rgb(156, 163, 175);
                            }
                            .dark #chatWindow::-webkit-scrollbar-thumb {
                                background: rgb(51, 65, 85);
                            }
                            .dark #chatWindow::-webkit-scrollbar-thumb:hover {
                                background: rgb(71, 85, 105);
                            }
                        </style>
                    </template>
                        <style>
                            /* Custom scrollbar for chat window - WebKit browsers */
                            #chatWindow::-webkit-scrollbar { width: 10px; }
                            #chatWindow::-webkit-scrollbar-track {
                                background: transparent;
                                border-radius: 8px;
                            }
                            #chatWindow::-webkit-scrollbar-thumb {
                                border-radius: 8px;
                                background: linear-gradient(180deg, rgba(34,211,163,0.22), rgba(16,185,129,0.6));
                                box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
                                border: 2px solid rgba(17,24,39,0.0);
                            }
                            #chatWindow::-webkit-scrollbar-thumb:hover {
                                background: linear-gradient(180deg, rgba(34,211,163,0.32), rgba(16,185,129,0.8));
                            }

                            /* Dark-mode tweaks when .dark is applied to body */
                            .dark #chatWindow::-webkit-scrollbar-thumb {
                                background: linear-gradient(180deg, rgba(6,95,70,0.18), rgba(16,185,129,0.4));
                                box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
                            }
                            .dark #chatWindow::-webkit-scrollbar-thumb:hover {
                                background: linear-gradient(180deg, rgba(6,95,70,0.28), rgba(16,185,129,0.6));
                            }

                            /* Firefox scrollbar styling */
                            #chatWindow { scrollbar-width: thin; scrollbar-color: rgba(34,211,163,0.6) transparent; }
                        </style>
                    </template>
                </div>
            </div>
        </template>
    </div>
</div>
{% endblock %}
{% block scripts %}
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const ctx = document.getElementById('stockChart').getContext('2d');
        const loading = document.getElementById('chartLoading');
        const errorDiv = document.getElementById('chartError');
        const symbol = {{ company_name|tojson }};
        // Extract clean company name without .NS suffix for display
        const cleanCompanyName = symbol.replace(/\.NS$/, '');
        const periodButtons = document.querySelectorAll('.period-btn');
        let chart;
        let currentPeriod = 'max';
        let lastPrediction = null; // Variable to store the last prediction

        // Watch for the prediction panel being hidden and clear predictions
        document.addEventListener('alpine:init', () => {
            Alpine.data('stockApp', () => ({
                tab: '',
                init() {
                    this.$watch('tab', value => {
                        if (value !== 'predict') {
                            lastPrediction = null;
                            removeExistingPredictionDataset();
                            if (chart) chart.update();
                        }
                    });
                }
            }));
        });

        async function fetchAndRender(period) {
            try {
                loading.style.display = 'flex';
                errorDiv.classList.add('hidden');
                if (chart) { chart.destroy(); }
                // Fetch historical data for selected period
                const resp = await fetch(`/api/stock-history?symbol=${encodeURIComponent(symbol)}&period=${encodeURIComponent(period)}`);
                const data = await resp.json();
                let chartData = {
                    labels: [],
                    datasets: [{
                        label: symbol + ' Close Price',
                        data: [],
                        borderColor: '#22d3a3',
                        backgroundColor: 'rgba(34,211,163,0.1)',
                        pointRadius: 0,
                        borderWidth: 2,
                        tension: 0.1,
                        fill: true,
                    }]
                };
                if (data.history && data.history.length > 0) {
                    chartData.labels = data.history.map(d => d.x);
                    chartData.datasets[0].data = data.history.map(d => d.y);
                    chart = new Chart(ctx, {
                        type: 'line',
                        data: chartData,
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: { mode: 'index', intersect: false }
                            },
                            scales: {
                                x: {
                                    type: 'time',
                                    time: { unit: period === '1d' || period === '5d' ? 'day' : (period === '1mo' || period === '6mo' ? 'month' : 'year') },
                                    ticks: { color: '#a7f3d0' },
                                    grid: { color: 'rgba(34,211,163,0.1)' }
                                },
                                y: {
                                    ticks: { color: '#a7f3d0' },
                                    grid: { color: 'rgba(34,211,163,0.1)' }
                                }
                            }
                        }
                    });
                    loading.style.display = 'none';

                    // --- FIX: Re-apply predictions if panel is open ---
                    if (lastPrediction) {
                        addPredictionsToChart(lastPrediction);
                    }
                    // --- End Fix ---

                } else {
                    loading.style.display = 'none';
                    errorDiv.classList.remove('hidden');
                }
            } catch (e) {
                loading.style.display = 'none';
                errorDiv.classList.remove('hidden');
            }
        }

        // Button click handler
        periodButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                periodButtons.forEach(b => b.classList.remove('border-green-400', 'bg-green-900', 'text-green-100'));
                this.classList.add('border-green-400', 'bg-green-900', 'text-green-100');
                currentPeriod = this.getAttribute('data-period');
                fetchAndRender(currentPeriod);
            });
        });
        // Set default (Max) active
        periodButtons[periodButtons.length - 1].classList.add('border-green-400', 'bg-green-900', 'text-green-100');
        fetchAndRender(currentPeriod);

        // Prediction: hook up predict button and panel
        const predictBtn = document.getElementById('predictBtn');

        // helper to wait for elements rendered by Alpine's x-if
        async function waitForElements(ids, timeout = 1500) {
            const start = Date.now();
            while (Date.now() - start < timeout) {
                const found = ids.map(id => document.getElementById(id));
                if (found.every(el => el !== null)) return found;
                await new Promise(r => setTimeout(r, 100));
            }
            return ids.map(id => document.getElementById(id));
        }

        function removeExistingPredictionDataset() {
            if (!chart || !chart.data || !chart.data.datasets) return;
            const idx = chart.data.datasets.findIndex(d => d && d.label && d.label.toLowerCase().includes('predicted'));
            if (idx !== -1) {
                chart.data.datasets.splice(idx, 1);
            }
        }

        function addPredictionsToChart(predictions) {
            if (!chart || !predictions || predictions.length === 0) return;
            removeExistingPredictionDataset();

            const dataset = {
                label: 'Predicted',
                data: predictions, // Use predictions directly
                borderColor: '#f97316',
                backgroundColor: 'rgba(249,115,22,0.06)',
                pointRadius: 3,
                borderWidth: 2,
                borderDash: [6, 4],
                tension: 0.2,
                fill: false
            };
            chart.data.datasets.push(dataset);

            // Adjust chart axis to show predictions
            const lastPredictionDate = new Date(predictions[predictions.length - 1].x);
            const lastHistoryDate = new Date(chart.data.labels[chart.data.labels.length - 1]);
            
            if (lastPredictionDate > lastHistoryDate) {
                 chart.options.scales.x.max = lastPredictionDate.valueOf();
            }

            chart.update();
        }

        async function runPrediction(days = 7) {
            // ensure panel elements are present (Alpine x-if renders them after tab change)
            const [predictLoading, predictResults, predictError, predList, lastCloseEl, lastDateEl] = await waitForElements([
                'predictLoading', 'predictResults', 'predictError', 'predList', 'lastClose', 'lastDate'
            ], 2000);
            if (!predictLoading || !predictResults || !predList) {
                console.warn('Prediction UI elements not found; aborting prediction');
                return;
            }
            predictError.classList.add('hidden');
            predictResults.classList.add('hidden');
            predList.innerHTML = '';
            predictLoading.classList.remove('hidden');

            try {
                // include the currently selected period so backend uses the same history as the chart
                const resp = await fetch(`/api/predict?symbol=${encodeURIComponent(symbol)}&days=${encodeURIComponent(days)}&period=${encodeURIComponent(currentPeriod)}`);
                const json = await resp.json();
                predictLoading.classList.add('hidden');
                if (json.error) {
                    predictError.textContent = json.error || 'Prediction failed';
                    predictError.classList.remove('hidden');
                    lastPrediction = null; // Clear stored prediction on error
                    return;
                }

                // Show results
                lastCloseEl.textContent = json.last_close ? json.last_close.toFixed(2) : 'N/A';
                lastDateEl.textContent = json.last_date || '';
                json.predictions.forEach(p => {
                    const li = document.createElement('li');
                    li.textContent = `${p.x}: ${Number(p.y).toFixed(2)}`;
                    predList.appendChild(li);
                });
                predictResults.classList.remove('hidden');

                // --- FIX: Store prediction and overlay on chart ---
                lastPrediction = json.predictions;
                addPredictionsToChart(lastPrediction);
                // --- End Fix ---
            } catch (e) {
                predictLoading.classList.add('hidden');
                predictError.textContent = 'Prediction failed. ' + (e && e.message ? e.message : '');
                predictError.classList.remove('hidden');
                lastPrediction = null; // Clear stored prediction on error
            }
        }

        // Run prediction when the predict button is clicked (opens panel via Alpine and triggers prediction)
        if (predictBtn) {
            predictBtn.addEventListener('click', function() {
                // small delay to let Alpine open the panel
                setTimeout(() => runPrediction(7), 220);
            });
        }

        // Company news: fetch top 5 headlines for this company when news panel opens
        const newsBtn = document.getElementById('newsBtn');

        async function fetchCompanyNews() {
            const [newsLoadingEl, newsListEl] = await waitForElements(['newsLoading', 'newsList'], 2000);
            if (!newsListEl) return;
            newsLoadingEl.classList.remove('hidden');
            newsListEl.innerHTML = '';
            try {
                const resp = await fetch(`/api/company-news?symbol=${encodeURIComponent(symbol)}&company=${encodeURIComponent(symbol)}`);
                const json = await resp.json();
                newsLoadingEl.classList.add('hidden');
                if (json.articles && json.articles.length) {
                    json.articles.forEach(a => {
                        const li = document.createElement('li');
                        li.className = 'text-green-300 hover:text-green-100 transition-colors';
                        const fullTitle = a.title || 'Untitled';
                        const maxLen = 110;
                        const titleText = fullTitle.length > maxLen ? fullTitle.slice(0, maxLen).trim() + '…' : fullTitle;
                        li.innerHTML = `
                            <a href="${a.url}" title="${fullTitle.replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer" class="hover:underline flex items-start gap-2">
                                <span class="flex-1">${titleText}</span>
                                <span class="text-green-400 opacity-80">→</span>
                            </a>
                        `;
                        newsListEl.appendChild(li);
                    });
                } else {
                    newsListEl.innerHTML = '<li class="text-green-200 text-center py-4">No recent news found.</li>';
                }
            } catch (e) {
                newsLoadingEl.classList.add('hidden');
                newsListEl.innerHTML = `<li class="text-red-400">Error fetching news: ${e && e.message ? e.message : e}</li>`;
            }
        }

        if (newsBtn) {
            newsBtn.addEventListener('click', function () {
                // allow Alpine to render the panel, then fetch
                setTimeout(() => fetchCompanyNews(), 220);
            });
        }

        // Chatbot: simple client that forwards user message to /api/chat
        let chatWindow, chatStatus, chatInput, sendChatBtn;

        function appendMessage(role, text, hasSources = false) {
            if (!chatWindow) return;
            
            const messageContainer = document.createElement('div');
            messageContainer.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
            
            const contentWrapper = document.createElement('div');
            contentWrapper.className = role === 'user' ? 'max-w-2xl' : 'max-w-2xl';
            
            const bubble = document.createElement('div');
            bubble.className = 'px-4 py-3 rounded-lg text-sm leading-relaxed break-words';
            bubble.style.wordWrap = 'break-word';
            bubble.style.whiteSpace = 'pre-wrap';
            bubble.textContent = text;
            
            if (role === 'user') {
                // User message: green background, white text, rounded on left only
                bubble.className += ' bg-green-600 text-white rounded-bl-lg rounded-tl-lg rounded-tr-lg';
            } else {
                // Assistant message: dark translucent background with green text to match site theme
                bubble.className += ' bg-slate-800/60 text-green-100 border border-green-800/30 rounded-br-lg rounded-tr-lg rounded-tl-lg';
            }
            
            contentWrapper.appendChild(bubble);

            // If assistant message and sources exist, add small badge
            if (role !== 'user' && hasSources) {
                const badge = document.createElement('div');
                badge.className = 'text-xs text-gray-500 mt-1 ml-1 flex items-center gap-1';
                badge.innerHTML = '<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 1 1 0 000 2H6a6 6 0 016 6v3a3 3 0 01-3 3H7a1 1 0 100 2h2a5 5 0 005-5v-3a8 8 0 00-8-8H6a1 1 0 000 2H4a2 2 0 00-2 2v7a2 2 0 002 2h2a1 1 0 100-2H4V5z"></path></svg> Latest info from web';
                contentWrapper.appendChild(badge);
            }
            messageContainer.appendChild(contentWrapper);
            chatWindow.appendChild(messageContainer);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendChat() {
            if (!chatInput || !chatWindow) return;
            const text = chatInput.value.trim();
            if (!text) return;
            appendMessage('user', text);
            chatInput.value = '';
            chatStatus.textContent = 'Thinking...';

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'gpt-5-mini',
                        messages: [ { role: 'user', content: text } ],
                        company: cleanCompanyName,
                        symbol: symbol,
                        period: currentPeriod,
                        referer: window.location.href,
                        title: document.title
                    })
                });

                const json = await resp.json();
                chatStatus.textContent = '';
                if (!resp.ok) {
                    let msg = (json && (json.error || (json.result && json.result.error))) || `Server error (${resp.status})`;
                    if (typeof msg === 'object') {
                        try { msg = JSON.stringify(msg, null, 2); } catch (e) { msg = String(msg); }
                    }
                    appendMessage('assistant', 'Error: ' + msg);
                    return;
                }

                // Prefer server-provided assistant_text (pre-extracted); otherwise try common shapes
                let assistantText = '';
                if (json && json.result && json.assistant_text) {
                    assistantText = json.assistant_text;
                } else if (json && json.result) {
                    const r = json.result;
                    if (r.choices && r.choices.length) {
                        const ch = r.choices[0];
                        if (ch.message && typeof ch.message.content === 'string') assistantText = ch.message.content;
                        else if (ch.text && typeof ch.text === 'string') assistantText = ch.text;
                        else if (ch.delta && typeof ch.delta.content === 'string') assistantText = ch.delta.content;
                        else if (ch.message && typeof ch.message === 'string') assistantText = ch.message;
                    } else if (r.output && r.output.length) {
                        assistantText = r.output.map(o => o.content || o.text || '').join('\n');
                    }
                }

                if (!assistantText) {
                    // fallback: pretty-print whole response (will be shown when nothing else found)
                    assistantText = JSON.stringify(json.result || json, null, 2);
                }

                // Determine if server signaled Brave enrichment
                const hasSources = Boolean(json && (json.brave_enriched || (json.sources_count && json.sources_count > 0) || json.has_sources));
                appendMessage('assistant', assistantText, hasSources);
            } catch (e) {
                chatStatus.textContent = '';
                appendMessage('assistant', 'Error: ' + (e && e.message ? e.message : e));
            }
        }

        function initChatbot() {
            chatWindow = document.getElementById('chatWindow');
            chatStatus = document.getElementById('chatStatus');
            chatInput = document.getElementById('chatInput');
            sendChatBtn = document.getElementById('sendChatBtn');

            if (sendChatBtn) {
                sendChatBtn.addEventListener('click', sendChat);
            }
            if (chatInput) {
                chatInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendChat();
                    }
                });
                // Focus input when chatbot panel opens
                chatInput.focus();
            }
        }

        // Watch for chatbot tab activation
        const chatbotBtn = document.getElementById('chatbotBtn');
        if (chatbotBtn) {
            chatbotBtn.addEventListener('click', function() {
                setTimeout(initChatbot, 250);
            });
        }
    });
    </script>
