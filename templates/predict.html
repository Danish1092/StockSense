{% extends "base.html" %}
{% block title %}Predict Price - StockSense{% endblock %}

{% block content %}
<div class="min-h-screen bg-black py-12 px-4 flex flex-col items-center justify-center">

    <div class="bg-black/80 backdrop-blur-md rounded-3xl shadow-2xl border border-green-700/40 
                p-10 w-full max-w-7xl mx-auto">

        <!-- Heading -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-green-400 tracking-wide drop-shadow mb-3">
                Select a Company to Predict Price
            </h1>
            <p class="text-green-300/80 text-base">
                Choose any company below to get AI-powered stock price predictions.
            </p>
        </div>

        <!-- Company Cards -->
        <form method="get" action="{{ url_for('info') }}">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10 place-items-center">

                {% for company in companies %}
                <button
                    type="submit"
                    name="company"
                    value="{{ company }}"
                    class="group relative w-full max-w-md
                           rounded-3xl overflow-hidden
                           bg-gradient-to-b from-black via-black to-green-950/40
                           border border-green-500/50
                           shadow-2xl shadow-green-900/40
                           hover:border-green-400 hover:shadow-green-500/80
                           hover:-translate-y-2 hover:scale-[1.02]
                           transition-all duration-300 ease-out
                           focus:outline-none focus:ring-2 focus:ring-green-400

                           {% if loop.last and companies|length % 3 == 1 %}
                               lg:col-start-2
                           {% elif loop.last and companies|length % 3 == 2 %}
                               lg:col-start-2
                           {% endif %}
                           ">

                    <!-- Glow ring -->
                    <div class="pointer-events-none absolute inset-0 rounded-3xl opacity-0
                                group-hover:opacity-100 bg-green-500/10 blur-xl transition-opacity"></div>

                    <!-- Card content -->
                    <div class="relative z-10 flex flex-col h-full">

                        <!-- Image on top -->
                        <div class="w-full h-40 md:h-44 overflow-hidden">
                            <img
                                src="{{ url_for('static', filename=company_logos[company]) }}"
                                alt="{{ company }} image"
                                class="w-full h-full object-cover"
                            >
                        </div>

                        <!-- Info area below -->
                        <div class="flex flex-col items-center justify-center gap-2 px-4 py-4
                                    bg-gradient-to-b from-black/70 via-black/80 to-black/60">

                            <span class="text-lg md:text-xl font-bold text-green-200 tracking-wide text-center">
                                {{ company }}
                            </span>

                            <span class="text-[11px] md:text-xs text-green-300/80 uppercase tracking-[0.22em]">
                                View Prediction
                            </span>

                            <!-- Accent line -->
                            <div class="mt-1 h-px w-12 bg-gradient-to-r from-transparent via-green-400 to-transparent opacity-70"></div>
                        </div>
                    </div>
                </button>
                {% endfor %}

            </div>
        </form>
    </div>
</div>
{% endblock %}
